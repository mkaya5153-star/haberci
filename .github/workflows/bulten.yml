name: Bülten

# Her gün 07:30 ve 19:00 (Türkiye saati) otomatik çalışır. Yapay zekâ gerekmez.
# GitHub saatleri UTC tutar: 04:30 UTC = 07:30 TR, 16:00 UTC = 19:00 TR.
# Elle çalıştırmak için: GitHub > Actions > Bülten > Run workflow.
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      donem:
        description: "Dönem (boş bırakılırsa saate göre seçilir)"
        required: false
        type: choice
        options: ["", sabah, aksam]

permissions:
  contents: write

concurrency:
  group: bulten
  cancel-in-progress: false

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bülteni hazırla ve yayınla
        run: |
          if [ -n "${{ inputs.donem }}" ]; then
            python otomatik.py --donem "${{ inputs.donem }}"
          else
            python otomatik.py
          fi
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "Haberci"
          git config user.email "haberci@users.noreply.github.com"
          git add docs bulten veri/pubmed_gorulen.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Bülten $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
